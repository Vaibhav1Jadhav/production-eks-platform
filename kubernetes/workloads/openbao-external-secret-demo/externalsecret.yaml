# ==============================================================================
# ExternalSecret: OpenBao Declarative Secret Synchronization
# ==============================================================================
# Compatibility Baseline: External Secrets Operator v0.9.11
# CRD API Version: external-secrets.io/v1beta1
#
# Reconciles synthetic JSON secret from OpenBao mount 'secret' path 'app/database'
# into a localized native Kubernetes Secret named 'openbao-database-secret'.
#
# Invariants:
# 1. refreshInterval: 1h — Polling cadence to detect upstream credential rotations.
# 2. creationPolicy: Owner — Deleting this ExternalSecret cascades deletion to the
#    generated Kubernetes Secret object.
# 3. Target Secret is generated dynamically by ESO. NEVER commit generated Secrets to Git.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openbao-database-credential-sync
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: openbao-external-secret-demo
    app.kubernetes.io/component: external-secret-sync
    app.kubernetes.io/part-of: production-eks-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: SecretStore
  target:
    name: openbao-database-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: app/database
        property: username
    - secretKey: password
      remoteRef:
        key: app/database
        property: password
