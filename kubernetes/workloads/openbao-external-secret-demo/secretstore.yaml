# ==============================================================================
# Namespaced SecretStore: OpenBao Backend (Using ESO Vault-Compatible Provider)
# ==============================================================================
# Compatibility Baseline: External Secrets Operator v0.9.11
# CRD API Version: external-secrets.io/v1beta1
#
# Architectural Role & Provider Schema Rationale:
# - OpenBao is an open-source, community-governed fork of HashiCorp Vault under
#   the Linux Foundation (MPL-2.0).
# - ESO v0.9.11 contains no dedicated native 'provider.openbao' CRD schema.
#   Because OpenBao preserves complete HTTP API compatibility with Vault v1/v2
#   secret engines, ESO interfaces with OpenBao using the 'spec.provider.vault' schema.
#
# Security & Authentication:
# - Uses Kubernetes Auth Method: ESO authenticates using 'openbao-client-sa'
#   token projection mapped to OpenBao role 'openbao-app-role'.
# - Enforces TLS verification via ConfigMap 'openbao-ca-cert'.
# - Namespaced SecretStore provides local configuration scope in 'sample-workloads'.
#   It does NOT create an impermeable security boundary on its own; tenant isolation
#   requires coordinating OpenBao ACL policies, Kubernetes RBAC, and admission control.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-store
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: openbao-external-secret-demo
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: production-eks-platform
spec:
  provider:
    vault:
      server: "https://openbao.security-system.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: ConfigMap
        name: openbao-ca-cert
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "openbao-app-role"
          serviceAccountRef:
            name: openbao-client-sa
