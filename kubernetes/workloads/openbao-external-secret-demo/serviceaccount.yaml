# ==============================================================================
# ServiceAccounts: OpenBao ESO Client vs. Workload Identity Boundaries
# ==============================================================================
# 1. openbao-client-sa:
#    The controller identity used by External Secrets Operator to authenticate
#    against OpenBao via the Kubernetes Auth Method.
#    OpenBao validates the projected ServiceAccount token against the Kubernetes API
#    and issues a scoped client token according to OpenBao role policies.
#
# 2. openbao-app-workload-sa:
#    The workload application identity. Possesses zero OpenBao permissions and
#    zero Kubernetes Secret API permissions (get, list, watch).
#
# SECURITY BOUNDARY REALITIES:
# - Scope of Workload Protection: Denying direct OpenBao access prevents workload
#   code from querying the central secret store directly, but the application STILL
#   receives the synchronized Kubernetes Secret locally in its container.
# - Indirect Access Paths: An identity with pod-creation or exec permissions
#   (pods/create, pods/exec) in this namespace can mount or inspect any secret.
#   Pod Security Standards (PSS) enforce execution properties (non-root, read-only fs)
#   but do NOT restrict Secret references. Restricting Secret access requires namespace
#   RBAC, workload authorization design, and fine-grained admission policies.
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-client-sa
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: openbao-external-secret-demo
    app.kubernetes.io/component: controller-identity
    app.kubernetes.io/part-of: production-eks-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-app-workload-sa
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: openbao-external-secret-demo
    app.kubernetes.io/component: workload-identity
    app.kubernetes.io/part-of: production-eks-platform
