# ==============================================================================
# ExternalSecret: Declarative Cloud Secret Reconciliation
# ==============================================================================
# Compatibility Baseline: External Secrets Operator v0.9.11
# CRD API Version: external-secrets.io/v1beta1
#
# Reconciles synthetic JSON secret 'production/app/database' from AWS Secrets Manager
# into a localized native Kubernetes Secret named 'app-database-secret'.
#
# Invariants:
# 1. refreshInterval: 1h — Polling cadence to detect upstream credential rotations.
# 2. creationPolicy: Owner — Deleting this ExternalSecret cascades deletion to the
#    generated Kubernetes Secret object.
# 3. Target Secret is generated dynamically by ESO. NEVER commit the generated Secret to Git.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-database-credential-sync
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: external-secret-demo
    app.kubernetes.io/component: external-secret-sync
    app.kubernetes.io/part-of: production-eks-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager-store
    kind: SecretStore
  target:
    name: app-database-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: production/app/database
        property: password
    - secretKey: username
      remoteRef:
        key: production/app/database
        property: username
