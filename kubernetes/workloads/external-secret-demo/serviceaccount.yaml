# ==============================================================================
# ServiceAccounts: Decoupling Controller IAM from Workload Identity
# ==============================================================================
# In production on AWS EKS, controller identities (used to authenticate to AWS)
# must remain strictly separated from application identities.
#
# 1. eso-irsa-sa:
#    Annotated with the AWS IAM Role ARN for IAM Roles for Service Accounts (IRSA).
#    External Secrets Operator assumes this role via AWS STS AssumeRoleWithWebIdentity
#    to fetch credentials from AWS Secrets Manager.
#
# 2. external-secret-app-sa:
#    The application workload identity. Possesses ZERO AWS IAM permissions and ZERO
#    Kubernetes Secret API permissions. It consumes the synchronized Secret locally.
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-irsa-sa
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: external-secret-demo
    app.kubernetes.io/component: controller-identity
    app.kubernetes.io/part-of: production-eks-platform
  annotations:
    # Synthetic IAM Role ARN for EKS IRSA federation:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/eso-secrets-manager-role"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secret-app-sa
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: external-secret-demo
    app.kubernetes.io/component: workload-identity
    app.kubernetes.io/part-of: production-eks-platform
