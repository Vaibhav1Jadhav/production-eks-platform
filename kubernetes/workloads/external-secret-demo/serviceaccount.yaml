# ==============================================================================
# ServiceAccounts: Controller IAM vs. Workload Identity Boundaries
# ==============================================================================
# 1. eso-irsa-sa:
#    The controller identity used by External Secrets Operator to authenticate to AWS.
#    Annotated with the IAM Role ARN for IAM Roles for Service Accounts (IRSA).
#    ESO presents this projected token to AWS STS AssumeRoleWithWebIdentity to
#    retrieve credentials from AWS Secrets Manager.
#
# 2. external-secret-app-sa:
#    The workload application identity. Possesses zero AWS IAM provider permissions,
#    preventing application code from querying AWS Secrets Manager APIs directly.
#
# CRITICAL SECURITY BOUNDARIES:
# - Scope of Workload Protection: Denying AWS IAM permissions prevents the workload
#   from querying cloud provider APIs, but the application STILL receives and can
#   access the Kubernetes Secret value delivered into its container environment.
#   Compromise of the workload exposes its own delivered credentials.
# - Indirect Access Paths & Admission Boundaries: An identity with pod-creation or
#   exec permissions in this namespace (pods/create, pods/exec) can mount and extract
#   any namespace secret. Note that Kubernetes Pod Security Standards (PSS) enforce
#   Pod security properties (such as non-root execution and capability drops), but
#   do NOT restrict which Secrets a Pod may reference. Restricting Secret references
#   and extraction requires combining IAM scoping, namespace RBAC, workload authorization
#   design, and fine-grained admission policies (e.g., Kyverno, Gatekeeper, ValidatingAdmissionPolicy).
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-irsa-sa
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: external-secret-demo
    app.kubernetes.io/component: controller-identity
    app.kubernetes.io/part-of: production-eks-platform
  annotations:
    # Synthetic IAM Role ARN for EKS IRSA federation:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/eso-secrets-manager-role"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secret-app-sa
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: external-secret-demo
    app.kubernetes.io/component: workload-identity
    app.kubernetes.io/part-of: production-eks-platform
