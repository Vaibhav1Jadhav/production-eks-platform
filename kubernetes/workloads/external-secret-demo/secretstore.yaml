# ==============================================================================
# Namespaced SecretStore: AWS Secrets Manager Backend
# ==============================================================================
# Compatibility Baseline: External Secrets Operator v0.9.11
# CRD API Version: external-secrets.io/v1beta1
#
# Scope & Tenant Isolation Boundary:
# - Namespaced 'kind: SecretStore' establishes a localized configuration scope
#   within the 'sample-workloads' namespace.
# - A namespaced SecretStore does NOT independently guarantee complete tenant
#   isolation. The effective security boundary requires coordinated enforcement of:
#   1. AWS IAM policy scoping on the projected IRSA role (limiting secret path access).
#   2. Kubernetes RBAC restricting 'secrets', 'externalsecrets', and 'secretstores'.
#   3. Namespace admission controls (preventing unauthorized pod creation/exec).
#   4. Workload identity isolation.
#
# Authentication:
# Authenticates to AWS Secrets Manager using the dedicated controller ServiceAccount
# (eso-irsa-sa) via IRSA (projected JWT web identity federation).
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager-store
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: external-secret-demo
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: production-eks-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-irsa-sa
