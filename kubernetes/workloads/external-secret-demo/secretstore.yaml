# ==============================================================================
# Namespaced SecretStore: AWS Secrets Manager Backend
# ==============================================================================
# API Version: external-secrets.io/v1beta1 (Supported in ESO v0.9.11+ / v0.10.x)
#
# Scope: Namespaced kind: SecretStore
# isolates external secret retrieval to the sample-workloads namespace.
# It authenticates to AWS Secrets Manager using the dedicated controller
# ServiceAccount (eso-irsa-sa) via projected JWT web identity federation.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager-store
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: external-secret-demo
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: production-eks-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-irsa-sa
