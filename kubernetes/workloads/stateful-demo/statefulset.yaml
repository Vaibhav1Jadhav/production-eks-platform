apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-demo
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: stateful-demo
    app.kubernetes.io/instance: stateful-demo-reference
    app.kubernetes.io/component: data-store
    app.kubernetes.io/part-of: production-eks-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  # The serviceName field references the Headless Service governing the network domain
  # for the StatefulSet. Each Pod receives an assigned DNS record:
  #   stateful-demo-0.stateful-demo-headless.sample-workloads.svc.cluster.local
  #   stateful-demo-1.stateful-demo-headless.sample-workloads.svc.cluster.local
  serviceName: stateful-demo-headless

  # 2 replicas demonstrate stable ordinal progression: stateful-demo-0 and stateful-demo-1
  replicas: 2

  # OrderedReady enforces sequential startup and shutdown (0 then 1; 1 then 0).
  # Guarantees that ordinal 0 completes initialization and achieves readiness before
  # ordinal 1 begins creation, preserving deterministic recovery order.
  podManagementPolicy: OrderedReady

  # RollingUpdate updates replicas in reverse ordinal order (1 then 0), waiting for
  # each replaced replica to become Ready before proceeding to the next.
  updateStrategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app.kubernetes.io/name: stateful-demo

  template:
    metadata:
      labels:
        app.kubernetes.io/name: stateful-demo
        app.kubernetes.io/instance: stateful-demo-reference
        app.kubernetes.io/component: data-store
        app.kubernetes.io/part-of: production-eks-platform
        app.kubernetes.io/version: "1.0.0"
    spec:
      # Pod-level security context enforcing non-root execution and default seccomp profile.
      # fsGroup: 10001 ensures volumes mounted via PersistentVolumeClaim are owned by group 10001,
      # granting the non-root container write permissions to /data without running as root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: stateful-demo
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # Container-level security context restricting privilege escalation and dropping all capabilities
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          # Resource sizing calibrated for this minimal reference demonstration
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          # Command: Simulates stateful workload recovery semantics.
          # When an ordinal Pod boots, it inspects its mounted persistent volume:
          # 1. First boot: Creates /data/identity-marker.txt with hostname, creation time, and restarts=0.
          # 2. Replacement boot: Discovers existing marker, increments restart count, and logs recovery time.
          # 3. Starts lightweight HTTP daemon serving /data on port 8080.
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              MARKER_FILE="/data/identity-marker.txt"
              echo "=== Booting Stateful Replica $(hostname) ==="
              if [ ! -f "$MARKER_FILE" ]; then
                echo "First initialization: creating persistent state for $(hostname)"
                printf "ordinal_identity=%s\ncreated_at=%s\nrestarts=0\nlast_boot=%s\n" \
                  "$(hostname)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$MARKER_FILE"
              else
                echo "State recovery: found existing persistent state for $(hostname)"
                RESTARTS=$(grep '^restarts=' "$MARKER_FILE" | cut -d= -f2 || echo 0)
                RESTARTS=$((RESTARTS + 1))
                sed -i "s/^restarts=.*/restarts=$RESTARTS/" "$MARKER_FILE"
                echo "recovered_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$MARKER_FILE"
                echo "last_boot=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$MARKER_FILE"
              fi
              echo "Active persistent state content:"
              cat "$MARKER_FILE"
              echo "Starting HTTP daemon on port 8080 serving /data"
              exec busybox httpd -f -p 8080 -h /data

          # Readiness Probe:
          # Evaluates traffic eligibility based on successful access to the persistent state marker.
          # If the volume is not attached, not mounted, or corrupted, the HTTP request fails,
          # marking the endpoint unready and preventing premature traffic routing.
          readinessProbe:
            httpGet:
              path: /identity-marker.txt
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2

          # Liveness Probe:
          # Detects fatal process deadlocks. Strictly avoids coupled downstream dependencies.
          livenessProbe:
            httpGet:
              path: /identity-marker.txt
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: data
              mountPath: /data

  # volumeClaimTemplates generates a dedicated PersistentVolumeClaim for each ordinal Pod:
  #   stateful-demo-0 -> data-stateful-demo-0
  #   stateful-demo-1 -> data-stateful-demo-1
  # These claims persist independently of Pod lifecycle and are reassociated automatically
  # when replacement Pods are created with the same ordinal identity.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: stateful-demo
          app.kubernetes.io/component: data-store
          app.kubernetes.io/part-of: production-eks-platform
      spec:
        # ReadWriteOnce: Volume can be mounted as read-write by a single node.
        # Note: This is a node-level attachment constraint, not a guarantee that only one Pod
        # can write (multiple pods on the same node could technically mount it if permitted).
        accessModes:
          - ReadWriteOnce

        # storageClassName is deliberately omitted to rely on the cluster's default StorageClass
        # (e.g. gp2/gp3 on AWS EKS, standard on KIND/minikube), ensuring portable demonstration.
        # To bind to a specific provisioner, set storageClassName explicitly.
        resources:
          requests:
            storage: 1Gi
