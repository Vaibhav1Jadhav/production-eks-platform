apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader-role
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: secret-demo
    app.kubernetes.io/component: rbac-authorization
    app.kubernetes.io/part-of: production-eks-platform
rules:
  # Least-privilege authorization boundary:
  # 1. Scoped to the individual named secret demo-app-secret via resourceNames.
  # 2. Restricted to verb get only. Does not grant collection verbs (such as list or watch), which would
  #    allow enumerating and inspecting other secrets within the sample-workloads namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["demo-app-secret"]
    verbs: ["get"]
