# ==============================================================================
# SYNTHETIC PLACEHOLDER SECRET — NEVER COMMIT PRODUCTION CREDENTIALS TO GIT
# ==============================================================================
# This manifest exists solely for offline dry-run rendering and static validation.
# Committing Base64-encoded or plaintext secrets into Git violates basic security hygiene.
#
# In production, credentials should be dynamically injected by external secret operators
# (Milestone #26) or provisioned out-of-band via secure pipelines.
#
# For local cluster experimentation, create the secret imperatively out-of-band:
#   kubectl create secret generic demo-app-secret \
#     --namespace=sample-workloads \
#     --from-literal=password=<DEMO_SECRET_VALUE> \
#     --dry-run=client -o yaml | kubectl apply -f -
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: demo-app-secret
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: secret-demo
    app.kubernetes.io/component: credential-store
    app.kubernetes.io/part-of: production-eks-platform
type: Opaque
stringData:
  password: <DEMO_SECRET_VALUE>
