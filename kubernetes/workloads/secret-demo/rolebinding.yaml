apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader-binding
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: secret-demo
    app.kubernetes.io/component: rbac-authorization
    app.kubernetes.io/part-of: production-eks-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader-role
subjects:
  - kind: ServiceAccount
    name: secret-demo-sa
    namespace: sample-workloads
