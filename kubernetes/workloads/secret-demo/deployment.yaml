apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-demo
  namespace: sample-workloads
  labels:
    app.kubernetes.io/name: secret-demo
    app.kubernetes.io/instance: secret-demo-reference
    app.kubernetes.io/component: credential-consumer
    app.kubernetes.io/part-of: production-eks-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secret-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secret-demo
        app.kubernetes.io/instance: secret-demo-reference
        app.kubernetes.io/component: credential-consumer
        app.kubernetes.io/part-of: production-eks-platform
        app.kubernetes.io/version: "1.0.0"
    spec:
      # Workload identity. Note: Kubelet volume mount retrieval operates via node identity;
      # secret-demo-sa and its bound Role are used when in-pod code queries the kube-apiserver directly.
      serviceAccountName: secret-demo-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: secret-consumer
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-c"
            - |
              echo "secret-consumer process initialized. Awaiting secret volume delivery..."
              while true; do
                SECRET_FILE="/etc/secrets/demo-app-secret/password"
                if [ -f "$SECRET_FILE" ]; then
                  FILE_SIZE=$(wc -c < "$SECRET_FILE" | tr -d ' ')
                  FILE_PERMS=$(ls -l "$SECRET_FILE" | awk '{print $1}')
                  FINGERPRINT=$(sha256sum "$SECRET_FILE" | cut -c1-8)
                  echo "Secret volume active. Mode: ${FILE_PERMS}, Size: ${FILE_SIZE}B, Fingerprint: ${FINGERPRINT}..., Health: OK"
                else
                  echo "CRITICAL: Secret file missing at ${SECRET_FILE}"
                fi
                sleep 30
              done

          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi

          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - "[ -s /etc/secrets/demo-app-secret/password ]"
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          livenessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - "[ -f /etc/secrets/demo-app-secret/password ]"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            # Mount the Secret volume into a dedicated directory on tmpfs
            - name: secret-volume
              mountPath: /etc/secrets/demo-app-secret
              readOnly: true

      volumes:
        # Secret volume delivery model:
        # In-memory tmpfs mount backed by kubelet node memory.
        # defaultMode: 0400 (read-only by owner, unreadable by group/world).
        - name: secret-volume
          secret:
            secretName: demo-app-secret
            defaultMode: 256  # 0400 octal = 256 decimal
